<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Runstray</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      .dev-join { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
      .dev-join input, .dev-join button { font: 18px Georgia, serif; padding: 10px 14px; border-radius: 6px; border: 1px solid #4a4a4a; background: #15181c; color: #f2ead8; }
      .dev-join input { width: 14em; }
      .dev-join input.bad { border-color: #c0524a; }
      .dev-join button { cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
